<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora IMC</title>
  </head>
  <body>
    <h1>CALCULADORA DE IMC</h1>
    <br />
    <form onsubmit="return calcular(event);">
      <label for="peso">Digite seu peso</label>
      <br />
      <input type="text" name="peso" id="peso" placeholder="Ex: 60" />
      <br /><br />
      <label for="altura">Digite sua altura</label>
      <br />
      <input type="text" name="altura" id="altura" placeholder="Ex: 1.75" />
      <br /><br />
      <input type="submit" value="Calcular IMC" />
    </form>

    <div id="resultado"></div>

    <script src="app.js"></script>
  </body>
</html>
